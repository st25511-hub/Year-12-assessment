{% extends "base.html" %}

{% block content %}

<section class="booking-section">

    <div class="booking-card">

        <div class="booking-header">

            <div class="large-icon">
                {{ event.icon }}
            </div>

            <div>
                <p class="eyebrow">BOOKING</p>
                <h2>{{ event_name }}</h2>
                <p>{{ event.date }}</p>
            </div>

        </div>


        <div class="availability">

            🎟️ <strong>{{ event.available }}</strong>
            tickets currently available

        </div>


        {% if error %}

        <div class="error">
            ⚠️ {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >


            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="ticket_type">
                Ticket Type
            </label>

            <select
                id="ticket_type"
                name="ticket_type"
                required
            >

                <option value="" disabled selected>
                    Select ticket type
                </option>

                <option value="Student">
                    Student
                </option>

                <option value="Staff">
                    Staff
                </option>

                <option value="Adult">
                    Adult
                </option>

                <option value="Child">
                    Child
                </option>

            </select>


            <label for="quantity">
                Number of Tickets
            </label>

            <input
                type="number"
                id="quantity"
                name="quantity"
                min="1"
                max="{{ event.available }}"
                placeholder="Enter quantity"
                required
            >


            <button type="submit">
                Confirm Booking →
            </button>

        </form>


        <a
            class="back-link"
            href="{{ url_for('index') }}"
        >
            ← Back to Events
        </a>

    </div>

</section>

{% endblock %}
